<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team picture, version 1</title>
<!-- The main page's team picture as live on 28 Oct 2026 (one ring for early access, a dashed ring for 0.2),
     saved before version 2 was drawn. Markup and styles copied unchanged from site/index.html and site/styles.css. -->
<style>
:root {
  --bg: #F5F6F8;
  --surface: #FFFFFF;
  --fg: #0B1F3A;
  --muted: #44546B;
  --rule: #D3D8E0;
  --accent: #0B1F3A;
  --accent-fg: #FFFFFF;
  --link: #1B4B8F;
  --silver: #C0C6CF;
  --orbit: #B9C1CC; /* decorative rings in the team picture */
  --focus: #1B4B8F;
  --display: "Montserrat", "Avenir Next", "Century Gothic", "Segoe UI", Arial, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --step--1: 1rem; /* smallest text on the page: 16px (section 6); the footer uses 13px */
  --step-0: 1.0625rem;
  --step-1: 1.25rem;
  --step-3: clamp(min(1.75rem, 8vw), 1.35rem + 1.7vw, 2.375rem);
  /* Headings are capped by screen width on very narrow phones, so large system text never splits a word. */
  --step-4: clamp(min(2.25rem, 10.5vw), 1.5rem + 3.6vw, 3.75rem);
  --gutter: clamp(1rem, 4vw, 2.5rem);
  --tap: max(44px, 2.75rem); /* touch target, never under 44px */
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0B1F3A;
    --surface: #12294A;
    --fg: #F2F4F7;
    --muted: #C0C6CF;
    --rule: #2A4062;
    --accent: #FFFFFF;
    --accent-fg: #0B1F3A;
    --link: #AFC6F2;
    --focus: #FFD479;
    --orbit: #3A5478;
    color-scheme: dark;
  }
}


body { margin: 0; padding: 2rem; background: var(--bg); color: var(--fg); font-family: var(--body); }
.team-visual figcaption { font-family: var(--mono); }
/* Team picture. Rings and stars are decoration; planned roles are dashed, and the table beside it and
   the text alternative say so in words (the phone picture also has a caption).
   Lines, outlines and text use --fg and --muted, which pass 3:1 (graphics) and 4.5:1 (text) in both themes. */
.team-visual { margin: 0; display: grid; gap: 0.75rem; min-width: 0; width: 100%; max-width: 45rem; justify-self: center; }
.team-visual svg { display: block; width: 100%; height: auto; }
.team-visual .orbit-narrow { display: none; max-width: 358px; margin-inline: auto; }
@media (max-width: 37.49rem) {
  .team-visual .orbit-wide { display: none; }
  .team-visual .orbit-narrow { display: block; }
  figure.team-visual figcaption { display: block; } /* the phone picture has no tags, so the key explains the dashes */
}
.team-visual figcaption { display: none; font-family: var(--mono); font-size: var(--step--1); color: var(--muted); }
.team-visual .tv-orbit-now { fill: none; stroke: var(--orbit); stroke-width: 1.25; }
.team-visual .tv-orbit-planned { fill: none; stroke: var(--orbit); stroke-width: 1.25; stroke-dasharray: 3 6; }
.team-visual .tv-you { fill: var(--surface); stroke: var(--fg); stroke-width: 1.5; }
.team-visual .tv-label { font-family: var(--body); font-weight: 600; font-size: 18px; fill: var(--fg); }
.team-visual .orbit-wide .tv-label { font-size: 24px; }
.team-visual .tv-link { fill: none; stroke: var(--fg); stroke-width: 1.5; }
.team-visual .tv-link-planned { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; }
.team-visual .tv-arrow { fill: var(--fg); }
.team-visual .tv-hub { fill: #0B1F3A; }
.team-visual .tv-hub-ring { fill: none; stroke: var(--orbit); stroke-width: 1.5; }
.team-visual .tv-node { fill: var(--fg); }
.team-visual .tv-icon { fill: none; stroke: var(--bg); stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
.team-visual .tv-node-planned { fill: var(--bg); stroke: var(--muted); stroke-width: 1.75; stroke-dasharray: 5 4; }
.team-visual .tv-icon-planned { fill: none; stroke: var(--muted); stroke-width: 2.25; stroke-linecap: round; stroke-linejoin: round; }
.team-visual .tv-st path { fill: none; stroke: var(--silver); stroke-width: 1; stroke-linecap: round; }
.team-visual .tv-st .tv-st2 { stroke-width: 0.75; }
.team-visual .tv-st circle, .team-visual .tv-dot { fill: var(--silver); }
@media (prefers-color-scheme: dark) {
  /* The Manager's navy disc would vanish on the navy page; a silver ring keeps it at 9.6:1. */
  .team-visual .tv-hub-ring { stroke: var(--silver); }
}


.team-visual .orbit-narrow { display: block; margin-top: 3rem; }
.team-visual figcaption { display: block; }
</style>
</head>
